name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src testes
      - run: pytest
      # transforma os dados versionados (dbt build + testes de qualidade) e gera o site, sem rede
      - run: python -m focus.pipeline --sem-ingestao
